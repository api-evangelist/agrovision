domain_standard:
  id: ucp
  name: Universal Commerce Protocol 2026-08-25
  market: retail / direct-to-consumer commerce
  declared_in_contract: true
  signature: >-
    The store's own /.well-known/ucp names service "dev.ucp.shopping" with transport "mcp" and
    enumerates capability URIs under the dev.ucp.shopping.* namespace, and the live MCP endpoint
    returns the standard's canonical tool names (search_catalog, create_cart, create_checkout,
    complete_checkout, get_order). A buyer-side agent that already speaks UCP integrates with
    this store with no bespoke connector.
  evidence: https://shop.fruitist.com/.well-known/ucp
  authored_by: Shopify (platform implementation) on a host Agrovision controls
