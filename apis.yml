apis:
- aid: agrovision-ucp-commerce
  name: Fruitist Store UCP Commerce MCP
  description: >-
    The agent-facing commerce surface of the Fruitist (Agrovision) direct-to-consumer store.
    It is a Universal Commerce Protocol 2026-08-25 service exposed over MCP at
    https://shop.fruitist.com/api/ucp/mcp and returns 13 tools covering catalog search and
    lookup, cart lifecycle, and checkout lifecycle including cancellation. The protocol
    implementation is Shopify's platform UCP service; the host, the catalog and the orders are
    Agrovision's. tools/list answers anonymously; completing a checkout requires contemporaneous
    buyer approval.
  humanURL: https://shop.fruitist.com/
  image: https://cdn.prod.website-files.com/67eb354a3bfe8fdee496f42f/67ec64d28ebae3f8761dd62f_e6fc4a7ca608233e7083f589ede8cac1_og.jpeg
