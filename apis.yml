aid: agrovision
name: Agrovision
description: >-
  Agrovision — rebranded to Fruitist in April 2025 — is a vertically integrated premium
  superfruit company founded in 2012 and headquartered in Century City, California, with a
  second office in San Isidro, Peru. It farms, packs, ships and markets jumbo blueberries,
  raspberries, blackberries and cherries across ten microclimates in Peru, Mexico, Morocco,
  Chile, Oregon, Egypt and China, selling into 12,500+ retail doors in 28 countries through
  Costco, Walmart, Whole Foods, Trader Joe's, Sprouts and Wakefern. It is a grower and
  consumer-brand business, not a software vendor: it publishes no developer program, no API
  reference and no machine-readable API contract of its own. The one agent-callable surface it
  operates is its Shopify direct-to-consumer store at shop.fruitist.com, which serves a live
  Universal Commerce Protocol (UCP) MCP endpoint, an llms.txt/agents.md pair and Shopify
  customer-account OpenID Connect discovery documents on the company's own host.
