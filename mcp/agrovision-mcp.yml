authorship_note: The MCP service is Shopify's Universal Commerce Protocol implementation, served from
  a host Agrovision/Fruitist controls (shop.fruitist.com, canonically fruitist.myshopify.com) and bound
  to Agrovision's own catalog, carts and orders. Agrovision did not author the protocol or the tool schemas;
  it operates the store the tools act on. Recorded here because an agent can call it today against this
  company's products — not because the company published a contract.
