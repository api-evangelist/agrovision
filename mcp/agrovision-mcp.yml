- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout (shipping address, delivery method, buyer details).
- name: complete_checkout
  category: checkout
  description: Completes a checkout; returns order ID, Thank You Page URL or errors.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
