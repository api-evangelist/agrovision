notes:
- Every tool inputSchema requires a `meta.ucp-agent.profile` URI — UCP agent profile discovery
  is mandatory on every call.
- Prices are integers in ISO 4217 minor units paired with a currency code.
- complete_checkout requires contemporaneous buyer approval; agents must not pay unattended.
